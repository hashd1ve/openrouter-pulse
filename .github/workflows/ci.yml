name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      # Unit, mart and dashboard tests. No network: they run against frozen
      # fixtures, so a change in OpenRouter's API can never turn this red.
      # That is test_contract.py's job, in its own workflow.
      - name: Tests
        run: pytest -q

      - name: Pipeline reproduces from committed raw snapshots
        run: |
          python -m orpulse.cli build
          python -m orpulse.cli report
          python -m orpulse.cli dashboard
          # Only FINDINGS.md is asserted byte-for-byte. It is a pure function of
          # the marts. The dashboard is not, and deliberately so: its vitals
          # panel reports how old the data is *right now*, which is a live
          # property and the whole point of having the panel. Asserting
          # byte-equality on a page that reports the current time would be the
          # wrong assertion, so the dashboard is only checked for being buildable.
          git diff --exit-code docs/FINDINGS.md \
            || (echo "::error::FINDINGS.md is stale; run 'make report' and commit" && exit 1)
