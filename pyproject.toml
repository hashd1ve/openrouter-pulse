[project]
name = "orpulse"
version = "0.1.0"
description = "Workload fingerprinting of the LLM market from OpenRouter's public data"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "altair>=5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
orpulse = "orpulse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orpulse = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "contract: hits the live OpenRouter API; excluded from the default run",
]
addopts = "-m 'not contract' --strict-markers"
